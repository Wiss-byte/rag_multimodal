[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "llama-index-core",
    "llama-index-readers-file",
    "llama-index-embeddings-huggingface",
    "llama-index-vector-stores-postgres",
    "pymupdf>=1.24",
    "pdfplumber",
    "ollama>=0.6.3",
    "langchain>=1.0",
    "langchain-ollama>=1.1.0",
    "streamlit>=1.65.0",
    "torchvision>=0.29.1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
